name: Workflow Kit
on:
  pull_request:
    # Draft pushes run nothing; ready_for_review starts the run for the head that counts.
    # converted_to_draft starts a skipped run that cancels a running one through the concurrency group.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Workflow Kit checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    # Runs take 1 to 3 minutes since #202; board tests need about 8 s of that.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        env:
          # Configure only checkout's Git processes; the requested ref still selects HEAD.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Regenerate everything, then Git proves the committed outputs were current.
      - run: node scripts/init-project.mjs --existing
      - run: node scripts/setup-skills.mjs
      - run: node scripts/board-readme.mjs
      # Intent-to-add plus the HEAD comparison also catch new and deleted generated files.
      - run: git add --intent-to-add --all && git diff --exit-code HEAD
      - run: node --test scripts/tests
