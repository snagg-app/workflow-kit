name: Spec oder längere Aufgabe
description: Wie die Aufgabe, mit einer Kurzfassung in einfacher Sprache vorneweg.
title: "(Spec) "
labels: [spec]
body:
  - type: markdown
    attributes:
      value: |
        Braucht die Aufgabe eine menschliche Entscheidung oder Handlung? Dann nach dem Erstellen
        `## Menschliche Mitwirkung nötig` als ersten Abschnitt ergänzen und das Label
        `needs-human-input` setzen (Wer, Was fehlt, Wirkung, Antwortweg). Sonst weglassen.
  - type: textarea
    id: summary
    attributes:
      label: Kurz gesagt
      description: 2 bis 4 Sätze in einfacher Sprache. Was stört heute, was wird anders, wer merkt es?
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Wofür brauchen wir das?
      description: Welches belegte Problem hat welcher Nutzer oder Ablauf? Bei Fehlern Reproduktion und erwartetes Verhalten nennen.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Was bringt es uns?
      description: Konkreter Vorteil oder vermiedener Schaden, ohne unbelegte Zeit- oder Kostenversprechen.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Was muss gemacht werden?
      description: Vollständiges Ergebnis und klare Grenzen. Was gehört ausdrücklich nicht dazu?
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Wie soll es umgesetzt werden?
      description: Geordnete Schritte mit Dateien, Symbolen, Verträgen und vorhandenen Bausteinen. Betroffene Rechte, Daten, Fehler und Wiederholung erklären. Offene Entscheidungen als Frage mit Empfehlung kennzeichnen.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Woran erkennen wir, dass es fertig ist?
      description: Prüffähige Kriterien, passender Test/Befehl oder genauer Prüfweg und erwartetes Ergebnis. Grenzen von Mocks und Live-Nachweisen nennen.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Abhängigkeiten und Wiederaufnahme
      description: Voraussetzungen mit Beleg, nächster Aktion und Zuständigkeit; sonst „keine bekannt“. Status und Priority stehen im Project, nicht hier.
    validations:
      required: true
